[project]
name = "verdict-eval"
version = "0.1.0"
description = "Grades AI coding agents on executable truth, not opinion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
verdict = "verdict.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["examples/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = ["examples/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
